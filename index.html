<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel1000</title>
    <script type="module" crossorigin src="/assets/index-oTSEaaiw.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BN9kUDIn.css">
  </head>
  <body>
    <script>
      function report(e) {
        fetch('http://localhost:3098/', { method: 'POST', body: String(e) }).catch(console.log);
      }
      window.addEventListener('error', function(e) {
        var str = 'ERROR: ' + (e.error ? (e.error.stack || e.error.message) : e.message);
        report(str);
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:9999;padding:20px;font-family:monospace;white-space:pre-wrap;">' + str + '</div>';
        console.error("WINDOW ERROR:", e.error || e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var str = 'PROMISE REJECTION: ' + (e.reason ? (e.reason.stack || e.reason.message || JSON.stringify(e.reason)) : 'Unknown');
        report(str);
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:darkred;color:white;z-index:9999;padding:20px;font-family:monospace;white-space:pre-wrap;">' + str + '</div>';
        console.error("PROMISE REJECTION:", e.reason);
      });
    </script>
    <div id="root"></div>
  </body>
</html>
